<!DOCTYPE html>

    <meta charset="UTF-8">

<body>
    <h1>Exercițiul 5</h1>
    <p>Verifică consola (apasă F12 sau Click Dreapta -> Inspect -> Console).</p>

    <script>
        
        let a = 10, b = 10, c = 12; 
        

        console.log(`Laturile date sunt: a=${a}, b=${b}, c=${c}`);

        
        if (a <= 0 || b <= 0 || c <= 0) {
            console.log("Laturile trebuie să fie numere pozitive.");
        }
        
        else if ( (a + b > c) && (a + c > b) && (b + c > a) ) {
            console.log("Cele 3 laturi pot forma un triunghi.");

            
            if (a === b && b === c) {
                console.log("Tipul triunghiului: Echilateral");
            } else if (a === b || a === c || b === c) {
                console.log("Tipul triunghiului: Isoscel");
            } else {
                console.log("Tipul triunghiului: Oarecare");
            }

        } 
        
        else {
            console.log("Cele 3 laturi NU pot forma un triunghi.");
        }
    </script>
</body>
</html>
